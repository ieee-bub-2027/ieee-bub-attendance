<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE BUB — Attendance Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* v2.5: two languages (EN/AR, toggle top-right) and two color modes
       (light/dark, manual toggle OR automatic from the device) are both
       supported. Every visible label lives in the STR dictionary near the
       top of the <script> block below and is applied via data-i18n /
       data-i18n-ph attributes — edit STR.en / STR.ar there to change wording,
       nothing in this <style> block needs touching for that. */
    :root {
      --page-bg: #EEF2F8;
      --card-bg: rgba(255,255,255,0.70);
      --card-border: rgba(10,32,54,0.12);
      --card-shadow: rgba(10,32,54,0.14);
      --text: #0A2036;
      --muted: #5C6B7A;
      --input-bg: rgba(255,255,255,0.92);
      --input-border: #D7DEE7;
      --focus-glow: rgba(22,82,143,0.30);
      --footer-text: #8A93A0;
      --badge-bg: rgba(10,32,54,0.92);
      --badge-text: #ffffff;
      --util-bg: rgba(255,255,255,0.75);
      --util-border: rgba(10,32,54,0.16);
      --brand-accent: #006496;
      --btn-grad-1: #0A2036;
      --btn-grad-2: #163F6B;
      --btn-shadow: rgba(10,32,54,0.28);
      --divider: rgba(10,32,54,0.12);
      --font-en: 'Inter', Arial, sans-serif;
      --font-ar: 'Readex Pro', 'Cairo', Tahoma, Arial, sans-serif;
      --font-body: var(--font-en);
    }
    :root[dir="rtl"] { --font-body: var(--font-ar); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page-bg: #060B14;
        --card-bg: rgba(19,42,64,0.55);
        --card-border: rgba(255,255,255,0.10);
        --card-shadow: rgba(0,0,0,0.45);
        --text: #EAF1FB;
        --muted: #93A6BA;
        --input-bg: rgba(15,33,53,0.85);
        --input-border: #2C4C6B;
        --focus-glow: rgba(90,160,255,0.40);
        --footer-text: #7488A0;
        --badge-bg: rgba(27,110,46,0.85);
        --badge-text: #ffffff;
        --util-bg: rgba(38,72,102,0.85);
        --util-border: rgba(255,255,255,0.28);
        --btn-shadow: rgba(70,170,220,0.38);
        --divider: rgba(255,255,255,0.12);
      }
    }
    :root[data-theme="dark"] {
      --page-bg: #060B14;
      --card-bg: rgba(19,42,64,0.55);
      --card-border: rgba(255,255,255,0.10);
      --card-shadow: rgba(0,0,0,0.45);
      --text: #EAF1FB;
      --muted: #93A6BA;
      --input-bg: rgba(15,33,53,0.85);
      --input-border: #2C4C6B;
      --focus-glow: rgba(90,160,255,0.40);
      --footer-text: #7488A0;
      --badge-bg: rgba(27,110,46,0.85);
      --badge-text: #ffffff;
      --util-bg: rgba(38,72,102,0.85);
      --util-border: rgba(255,255,255,0.28);
      --btn-shadow: rgba(70,170,220,0.38);
      --divider: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 14px 28px;
      color: var(--text);
      background: radial-gradient(circle at 20% -10%, rgba(22,82,143,0.16), transparent 55%), var(--page-bg);
      min-height: 100vh;
    }

    /* ---- Top bar: logo one side, utilities (season / lang / theme) other side ---- */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 2px 14px; }
    .topbar-logo img { height: 40px; width: auto; display: block; }
    .topbar-logo img.logo-dark { display: none; }
    :root:not([data-theme="light"]) .topbar-logo img.logo-light,
    :root[data-theme="dark"] .topbar-logo img.logo-light { display: none; }
    :root:not([data-theme="light"]) .topbar-logo img.logo-dark,
    :root[data-theme="dark"] .topbar-logo img.logo-dark { display: block; }
    @media not all and (prefers-color-scheme: dark) {
      :root:not([data-theme="dark"]) .topbar-logo img.logo-dark { display: none; }
      :root:not([data-theme="dark"]) .topbar-logo img.logo-light { display: block; }
    }
    .topbar-utils { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .season-badge { display: inline-block; background: var(--badge-bg); color: var(--badge-text); font-size: 11px; font-weight: 700; letter-spacing: 0.3px; padding: 5px 12px; border-radius: 999px; white-space: nowrap; }
    .util-btn { width: auto; margin: 0; padding: 6px 11px; font-size: 12px; font-weight: 700; line-height: 1; background: var(--util-bg); color: var(--text); border: 1px solid var(--util-border); border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 2px 8px var(--card-shadow); transition: filter .12s ease, transform .12s ease, box-shadow .12s ease; }
    .util-btn:hover { filter: brightness(1.15); box-shadow: 0 3px 12px var(--btn-shadow); }
    .util-btn:active { transform: scale(0.94); }
    .util-btn.icon-btn { font-size: 15px; padding: 5px 10px; }

    /* ---- Glass card ---- */
    .card { background: var(--card-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--card-border); border-radius: 18px; padding: 22px 18px 24px; box-shadow: 0 10px 32px var(--card-shadow); }

    h2 { text-align: center; margin: 0 0 2px; font-size: 19px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
    input, select {
      width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; font-size: 16px;
      border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text);
      font-family: var(--font-body);
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    input::placeholder { color: var(--muted); opacity: 0.8; }
    input:focus, select:focus { outline: none; border-color: var(--brand-accent); box-shadow: 0 0 0 3px var(--focus-glow); }
    /* v2.7: a wrong/missing field gets a visible red border + a short shake,
       on top of the existing error text — so a mistake reads as "you did
       something wrong here", not just as the system silently not moving on. */
    input.field-error, select.field-error {
      border-color: #D64545 !important;
      box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.22) !important;
      animation: shakeField 0.4s ease;
    }
    @keyframes shakeField {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    button {
      width: 100%; padding: 12px; margin-top: 16px; font-size: 16px; font-weight: 600;
      background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2)); color: #fff; border: none; border-radius: 10px; cursor: pointer;
      font-family: var(--font-body);
      transition: filter .12s ease, transform .1s ease, box-shadow .12s ease;
    }
    button:hover { filter: brightness(1.08); box-shadow: 0 6px 16px var(--btn-shadow); }
    button:active { transform: translateY(1px) scale(0.99); }
    button.secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--brand-accent); }
    button.finish { background: linear-gradient(135deg, #1B6E2E, #268F3F); }
    #reader { width: 100%; margin-top: 16px; border-radius: 10px; overflow: hidden; }
    #result { margin-top: 14px; padding: 10px; border-radius: 8px; font-weight: 600; text-align: center; display: none; }
    .ok { background: #DFF5E1; color: #1B6E2E; }
    .err { background: #FBE1E1; color: #A32020; }
    .badge-row { margin-top: 12px; font-size: 13px; color: var(--text); background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; }
    .badge-row div { margin: 2px 0; }
    .step-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(120,130,145,0.4); }
    .step-dots span.active { background: var(--brand-accent); }
    .page { display: none; }
    .page.active { display: block; }

    .welcome-intro { text-align: center; margin: 2px 0 10px; }
    .welcome-icon { margin-bottom: 6px; }
    .welcome-title { font-size: 18px; font-weight: 700; margin: 4px 0 4px; }
    .welcome-text { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.55; }

    /* v2.6: one unified confirmation box after a scan (message text + the
       scanned member's name/committee together) instead of two separate
       boxes stacked on top of each other. */
    #result .scan-name { font-size: 17px; font-weight: 700; margin-top: 6px; }
    #result .scan-meta { font-size: 13px; margin-top: 2px; opacity: 0.85; }
    .scan-counter { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }

    .manual-entry { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--divider); }
    .manual-entry-row { display: flex; gap: 8px; margin-top: 4px; }
    .manual-entry-row input { margin-top: 0; }
    .manual-entry-row button { width: auto; margin-top: 0; padding: 8px 16px; white-space: nowrap; }

    .summary-count { text-align: center; font-size: 15px; margin: 6px 0 16px; }
    .summary-count b { font-size: 24px; color: #1B6E2E; }
    .summary-list { margin-top: 8px; max-height: 340px; overflow-y: auto; }
    .summary-row { display: flex; align-items: center; gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--divider); }
    .summary-row .who { flex: 1; min-width: 0; }
    .summary-row .who .n { font-weight: 700; font-size: 14px; }
    .summary-row .who .c { font-size: 12px; color: var(--muted); }
    .summary-row .bonus { display: flex; align-items: center; gap: 4px; }
    .summary-row .bonus input[type="checkbox"] { width: auto; margin: 0; }
    .summary-row .bonus input[type="number"] { width: 58px; margin: 0; padding: 4px; font-size: 14px; }
    .summary-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0; }
    .summary-autorefresh-note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 10px; }
    .summary-retry { text-align: center; margin-top: 10px; }
    .summary-retry a { color: var(--brand-accent); font-weight: 600; cursor: pointer; text-decoration: underline; }

    .footer { text-align: center; margin-top: 20px; padding-top: 14px; font-size: 11px; color: var(--footer-text); }
  </style>
</head>

    let lang = "en";
    try { lang = localStorage.getItem("hrScannerLang") || "en"; } catch (e) {}

    function t(key) {
      return (STR[lang] && STR[lang][key] != null) ? STR[lang][key] : (STR.en[key] != null ? STR.en[key] : key);
    }

    let currentStep = 1; // 1,2,3 or "summary" — drives which subtitle key is shown

    function applyLang() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.innerHTML = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-ph]").forEach(function (el) {
        el.placeholder = t(el.getAttribute("data-i18n-ph"));
      });
      document.getElementById("lang-toggle").textContent = lang === "ar" ? "EN" : "AR";
      updateSubtitle();
      if (state.committee) renderBadgeSummary();
      updateScanCounter();
      if (document.getElementById("page-summary").classList.contains("active")) renderSummary();
    }

    function toggleLang() {
      lang = lang === "ar" ? "en" : "ar";
      try { localStorage.setItem("hrScannerLang", lang); } catch (e) {}
      applyLang();
    }

    function updateSubtitle() {
      const key = currentStep === "summary" ? "stepSummary" : ("step" + currentStep);
      document.getElementById("subtitle-text").innerHTML = t(key);
    }

    // ------------------------------------------------------------------
    // Theme: "system" (default, follows the device) or an explicit
    // "light"/"dark" the visitor picked here — remembered via localStorage,
    // same as the language choice, so it persists across reloads on the
    // same phone.
    // ------------------------------------------------------------------
    let theme = null; // null = follow system
    try { theme = localStorage.getItem("hrScannerTheme"); } catch (e) {}
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    }

    function effectiveIsDark() {
      if (theme === "dark") return true;
      if (theme === "light") return false;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function updateThemeIcon() {
      document.getElementById("theme-toggle").textContent = effectiveIsDark() ? "☀️" : "🌙";
    }

    function toggleTheme() {
      theme = effectiveIsDark() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("hrScannerTheme", theme); } catch (e) {}
      updateThemeIcon();
    }

    updateThemeIcon();

    // نداء JSONP — بيتفادى مشكلة CORS تمامًا، وده الأسلوب اللي جوجل نفسها بتنصح
    // بيه للنداء على Apps Script من موقع تاني (مفيش fetch ولا headers خاصة).
    function jsonp(params) {
      return new Promise(function (resolve, reject) {
        const cbName = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
        const script = document.createElement("script");

        window[cbName] = function (data) {
          resolve(data);
          cleanup();
        };

        function cleanup() {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        const qs = Object.keys(params)
          .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); })
          .concat(["callback=" + cbName])
          .join("&");

        script.src = API_URL + "?" + qs;
        script.onerror = function () {
          reject(new Error("Could not reach the Google server (check API_URL and your internet connection)"));
          cleanup();
        };
        document.body.appendChild(script);
      });
    }

    if (API_URL.indexOf("PASTE_YOUR") === 0) {
      showResult(false, "API link is not set yet — open index.html and put your Apps Script link in the API_URL variable.");
    } else {
      jsonp({ action: "getCommittees" })
        .then(populateCommittees)
        .catch(function (err) {
          showResult(false, t("couldNotLoadCommittees") + err.message);
        });
    }

    function populateCommittees(list) {
      const sel = document.getElementById("committee");
      list.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c.code;
        opt.textContent = c.code + " — " + c.name;
        sel.appendChild(opt);
      });
    }

    // ---- Shared state carried across the pages ----
    let state = {
      hrName: null,
      hrCode: null,
      committee: null,
      committeeName: null,
      password: null,
      sessionId: null,
      scannedCount: 0, // live, best-effort tally shown WHILE scanning only
      sessionMembers: null, // authoritative list fetched from the sheet when Finish is pressed
    };
    let scanner = null;
    let summaryPollTimer = null; // v2.8: auto-refresh interval id while page-summary is showing
    let scanWatchTimer = null; // v2.8: lightweight "did someone else close this session?" check while page-scan is showing

    // v2.7: visibly flags the field(s) that actually caused a login error —
    // a red border + a short shake, removed automatically after it plays —
    // so a wrong password/code/name reads as "fix THIS", not as the page
    // silently not responding to "Next".
    function shakeField() {
      for (let i = 0; i < arguments.length; i++) {
        const el = document.getElementById(arguments[i]);
        if (!el) continue;
        el.classList.remove("field-error");
        void el.offsetWidth; // restart the animation if it's already mid-shake
        el.classList.add("field-error");
        el.focus({ preventScroll: true });
      }
    }
    function clearFieldError(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove("field-error");
    }

    function goToPage(n) {
      currentStep = n;
      stopSummaryAutoRefresh(); // v2.8: leaving (or never having been on) the summary page — no reason to keep polling
      stopScanWatch(); // stopped by default; restarted below only if we're actually landing on page 3
      document.getElementById("step-dots").style.display = "flex";
      document.getElementById("page-summary").classList.remove("active");
      [1, 2, 3].forEach(function (i) {
        document.getElementById("page-" + (i === 1 ? "hr" : i === 2 ? "login" : "scan")).classList.toggle("active", i === n);
        document.getElementById("dot-" + i).classList.toggle("active", i <= n);
      });
      updateSubtitle();
      hideResult();
      // v2.8: while the scanning screen is open, quietly check every so often
      // whether someone else on this same session pressed "✖ Close" — if so,
      // this device gets bounced back to page 1 too, same as the summary
      // screen does, instead of letting the operator keep scanning into a
      // session that's already dead server-side.
      if (n === 3 && state.sessionId) startScanWatch();
    }

    // ---- Page 1 -> 2 : confirm the HR operator's own identity ----
    function hrLoginNext() {
      const hrName = document.getElementById("hr-name").value.trim();
      const hrCode = document.getElementById("hr-code").value.trim();
      clearFieldError("hr-name");
      clearFieldError("hr-code");
      if (!hrName || !hrCode) {
        showResult(false, t("enterNameCode"));
        shakeField(!hrName ? "hr-name" : null, !hrCode ? "hr-code" : null);
        return;
      }
      showResult(true, t("confirmingCode"));

      jsonp({ action: "validateHrOperator", hrCode: hrCode })
        .then(function (res) {
          if (!res.ok) {
            showResult(false, res.message);
            shakeField("hr-code"); // the code is the only thing this call actually checks
            return;
          }
          state.hrName = res.hrName; // the real name on file — used for the log, not the typed one
          state.hrCode = res.hrCode;

          hideResult();
          goToPage(2);
        })
        .catch(function (err) {
          showResult(false, t("couldNotReachServer") + err.message);
        });
    }

    // ---- Page 2 -> 3 : validate committee + password, auto-generate Session ID ----
    function committeeNext() {
      const committee = document.getElementById("committee").value;
      const password = document.getElementById("password").value;
      clearFieldError("committee");
      clearFieldError("password");
      if (!committee || !password) {
        showResult(false, t("chooseCommitteePassword"));
        shakeField(!committee ? "committee" : null, !password ? "password" : null);
        return;
      }
      showResult(true, t("checkingPassword"));

      jsonp({ action: "startSession", committee: committee, password: password, hrCode: state.hrCode })
        .then(function (res) {
          if (!res.ok) {
            showResult(false, res.message);
            shakeField("password"); // wrong/expired password is by far the most common cause here
            return;
          }
          state.committee = committee;
          state.committeeName = document.getElementById("committee").selectedOptions[0].textContent;
          state.password = password;
          state.sessionId = res.sessionId;
          state.scannedCount = 0;

          renderBadgeSummary();
          hideResult();
          goToPage(3);
        })
        .catch(function (err) {
          showResult(false, t("couldNotReachServer") + err.message);
        });
    }

    function renderBadgeSummary() {
      document.getElementById("badge-summary-3").innerHTML =
        "<div><b>" + t("committeeLabel") + "</b> " + state.committeeName + "</div>" +
        "<div><b>" + t("sessionLabel") + "</b> " + state.sessionId + " " + t("autoGenerated") + "</div>" +
        "<div><b>" + t("scanningAsHr") + "</b> " + state.hrName + " (" + state.hrCode + ")</div>";
    }

    // ---- Page 3 : camera scanning ----
    function startScan() {
      if (scanner) return;

      if (typeof Html5Qrcode === "undefined") {
        showResult(false, t("qrLibMissing"));
        return;
      }

      document.getElementById("start-scan-btn").style.display = "none";
      showResult(true, t("openingCamera"));

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        function (decodedText) {
          scanner.pause(true);
          jsonp({
            action: "recordAttendance",
            committee: state.committee,
            password: state.password,
            memberId: decodedText,
            session: state.sessionId,
            hrCode: state.hrCode,
          })
            .then(function (res) {
              onScanResult(res);
              setTimeout(function () { try { scanner.resume(); } catch (e) {} }, 1500);
            })
            .catch(function (err) {
              showResult(false, t("connectionError") + err.message);
              setTimeout(function () { try { scanner.resume(); } catch (e) {} }, 1500);
            });
        }
      ).catch(function (err) {
        scanner = null;
        document.getElementById("start-scan-btn").style.display = "block";
        var msg = String(err && err.message ? err.message : err);
        var extra = "";
        if (/NotAllowedError|Permission/i.test(msg)) {
          extra = " — tap the lock 🔒 or (ⓘ) icon next to the address bar above ← Permissions ← Camera ← Allow, then refresh and try again.";
        } else if (/NotFoundError|no camera/i.test(msg)) {
          extra = " — no back camera was found on this device, try another browser or device.";
        } else if (/NotReadableError/i.test(msg)) {
          extra = " — the camera might be in use by another app right now, close any open camera app and try again.";
        }
        showResult(false, t("couldNotOpenCamera") + msg + extra + t("manualFallbackHint"));
      });
    }

    // ---- Manual code fallback (same recordAttendance flow as the camera) ----
    function submitManualCode() {
      const codeInput = document.getElementById("manual-code");
      const code = codeInput.value.trim();
      if (!code) {
        showResult(false, t("typeCodeFirst"));
        return;
      }
      showResult(true, t("checkingCode"));
      jsonp({
        action: "recordAttendance",
        committee: state.committee,
        password: state.password,
        memberId: code,
        session: state.sessionId,
        hrCode: state.hrCode,
      })
        .then(function (res) {
          onScanResult(res);
          if (res.ok) codeInput.value = "";
        })
        .catch(function (err) {
          showResult(false, t("connectionError") + err.message);
        });
    }

    // NOTE (v2.5 fix): this only keeps a live, best-effort COUNT for
    // on-screen feedback while scanning. The end-of-session summary does
    // NOT rely on this — it re-fetches the real list from the sheet (see
    // finishSessionClick() / getSessionAttendance) so a refresh mid-session
    // can never make the summary disagree with what's actually saved.
    function onScanResult(res) {
      if (res.ok && res.memberName) {
        // v2.7: res.message from the server already reads "Checked in: <name>
        // — <committee> (<code>)" — showing it AND the name/committee row
        // below it printed the same person's name twice in the same green
        // box. Use one short, generic confirmation line instead; the
        // name/committee/code row underneath is what actually carries the
        // information now.
        showResult(true, t("checkedInSuccess"), res.memberName, res.memberCommittee + " — " + res.memberCode);
        state.scannedCount++;
        updateScanCounter();
      } else {
        showResult(res.ok, res.message);
      }
    }

    function updateScanCounter() {
      const el = document.getElementById("scan-counter");
      if (state.scannedCount <= 0) { el.style.display = "none"; return; }
      el.style.display = "block";
      el.textContent = state.scannedCount + (state.scannedCount === 1 ? t("checkedInSoFar1") : t("checkedInSoFarN"));
    }

    // ---- Finish: stop the camera, then load the AUTHORITATIVE list from the sheet ----
    function finishSessionClick() {
      if (scanner) {
        try { scanner.stop(); } catch (e) {}
        scanner = null;
      }
      document.getElementById("start-scan-btn").style.display = "block";
      showSummaryPage();
    }

    function showSummaryPage() {
      currentStep = "summary";
      document.getElementById("step-dots").style.display = "none";
      ["page-hr", "page-login", "page-scan"].forEach(function (id) {
        document.getElementById(id).classList.remove("active");
      });
      document.getElementById("page-summary").classList.add("active");
      updateSubtitle();
      document.getElementById("summary-status").style.display = "none";
      stopScanWatch(); // the summary screen's own poll (below) already covers the closed-session check
      loadSessionSummary();
      startSummaryAutoRefresh();
    }

    function loadSessionSummary() {
      document.getElementById("summary-count").innerHTML = "";
      document.getElementById("summary-list").innerHTML = '<div class="summary-empty">' + t("loadingSessionList") + '</div>';

      jsonp({
        action: "getSessionAttendance",
        committee: state.committee,
        password: state.password,
        hrCode: state.hrCode,
        session: state.sessionId,
      })
        .then(function (res) {
          if (!res.ok) {
            document.getElementById("summary-list").innerHTML =
              '<div class="summary-empty">' + t("couldNotLoadSessionList") + res.message + '</div>' +
              '<div class="summary-retry"><a onclick="loadSessionSummary()">' + t("retry") + '</a></div>';
            return;
          }
          state.sessionMembers = res.members;
          renderSummary();
        })
        .catch(function (err) {
          document.getElementById("summary-list").innerHTML =
            '<div class="summary-empty">' + t("couldNotLoadSessionList") + err.message + '</div>' +
            '<div class="summary-retry"><a onclick="loadSessionSummary()">' + t("retry") + '</a></div>';
        });
    }

    // v2.8.1 FIX: rows used to be keyed by their plain array INDEX
    // ("bonus-check-0", "bonus-check-1", ...) and every poll tick tore down
    // and rebuilt the ENTIRE list via innerHTML — even if a preserved value
    // was carried over correctly, replacing the actual DOM nodes while an
    // operator had a checkbox/number field focused on a real phone could cut
    // off mid-typing input, drop the on-screen keyboard, or leave a tap
    // landing on a stale/detached element. On a live device with several
    // people ticking boxes while the 4-second poll kept firing in the
    // background, this is what actually erased points and made Save send
    // nothing. Fixed by keying every row by the member's own CODE (stable
    // across rebuilds and across the whole session) and, far more
    // importantly, by never rebuilding an existing row's DOM node again
    // after its first render — see syncSummaryList() below, which is what
    // every poll tick and post-Save refresh now uses instead of a full
    // renderSummary().
    function safeIdPart_(code) {
      return "c" + String(code).replace(/[^A-Za-z0-9_-]/g, "_");
    }

    // Reads whatever bonus checkboxes/values are currently ticked on screen,
    // keyed by member code — used only when doing a genuine full rebuild
    // (first load, or a manual language toggle), so that rare rebuild still
    // can't throw away bonus points already ticked.
    function snapshotBonusInputs_() {
      const snap = {};
      if (!state.sessionMembers) return snap;
      state.sessionMembers.forEach(function (m) {
        const id = safeIdPart_(m.code);
        const checkEl = document.getElementById("bonus-check-" + id);
        const valEl = document.getElementById("bonus-val-" + id);
        if (checkEl && checkEl.checked) {
          snap[m.code] = valEl ? valEl.value : "";
        }
      });
      return snap;
    }

    // Full rebuild — used ONLY for the very first load of this screen (and a
    // manual language toggle). Never called on a timer, so it can never
    // interrupt someone mid-tap/mid-typing.
    function renderSummary(preserved) {
      if (!state.sessionMembers) return; // still loading (or failed) — loadSessionSummary() already shows that state
      if (!preserved) preserved = snapshotBonusInputs_(); // carries bonus entries through e.g. a language toggle too
      const list = document.getElementById("summary-list");
      const count = document.getElementById("summary-count");
      const n = state.sessionMembers.length;
      count.innerHTML = "<b>" + n + "</b>" + (n === 1 ? t("summaryCheckedIn1") : t("summaryCheckedInN"));

      if (n === 0) {
        list.innerHTML = '<div class="summary-empty">' + t("noOneScanned") + '</div>';
        return;
      }

      list.innerHTML = state.sessionMembers.map(function (m) {
        const id = safeIdPart_(m.code);
        return '<div class="summary-row" data-code="' + escapeHtml(m.code) + '">' +
          '<div class="who"><div class="n">' + escapeHtml(m.name) + '</div><div class="c">' + escapeHtml(m.committee) + ' — ' + escapeHtml(m.code) + '</div></div>' +
          '<div class="bonus">' +
            '<input type="checkbox" id="bonus-check-' + id + '" onchange="document.getElementById(\'bonus-val-' + id + '\').disabled = !this.checked;">' +
            '<input type="number" id="bonus-val-' + id + '" placeholder="pts" min="0" step="1" disabled>' +
          '</div>' +
        '</div>';
      }).join("");

      // Fill in each row's bonus value either from what THIS device has
      // ticked-but-not-yet-saved (preserved — always wins), or otherwise
      // from `m.bonus`, the value already saved on the sheet — which is how
      // a point another HR operator saved on their own phone shows up here
      // automatically, with nobody touching a refresh button.
      state.sessionMembers.forEach(function (m) {
        const id = safeIdPart_(m.code);
        const checkEl = document.getElementById("bonus-check-" + id);
        const valEl = document.getElementById("bonus-val-" + id);
        if (preserved.hasOwnProperty(m.code)) {
          if (checkEl) checkEl.checked = true;
          if (valEl) { valEl.disabled = false; valEl.value = preserved[m.code]; }
        } else if (m.bonus > 0) {
          if (checkEl) checkEl.checked = true;
          if (valEl) { valEl.disabled = false; valEl.value = m.bonus; }
        }
      });
    }

    // v2.8.1: the safe, NON-destructive counterpart to renderSummary() —
    // this is what every poll tick (and the post-Save refresh) actually
    // calls now. It never tears down or recreates a row that already
    // exists: it only (a) appends a brand-new row for a member this device
    // hasn't seen yet, and (b) for an existing row, updates its checkbox/
    // value in place — and ONLY if neither of those two specific inputs
    // currently has focus, so a poll landing exactly while someone is
    // mid-tap or mid-typing on THAT row never touches it (every other row
    // still updates normally). This is also why state.sessionMembers is
    // updated to the union of everyone seen so far, never replaced outright
    // — Save always reads straight from these same, never-recreated DOM
    // nodes.
    function syncSummaryList(members) {
      const list = document.getElementById("summary-list");
      const count = document.getElementById("summary-count");
      const n = members.length;
      count.innerHTML = "<b>" + n + "</b>" + (n === 1 ? t("summaryCheckedIn1") : t("summaryCheckedInN"));

      if (n === 0) {
        if (!list.querySelector(".summary-row")) {
          list.innerHTML = '<div class="summary-empty">' + t("noOneScanned") + '</div>';
        }
        return;
      }

      // First real member ever seen on this load — nothing to merge into yet,
      // so this one call is allowed to do the normal full build.
      if (!list.querySelector(".summary-row")) {
        state.sessionMembers = members;
        renderSummary();
        return;
      }

      const knownByCode = {};
      (state.sessionMembers || []).forEach(function (m) { knownByCode[m.code] = m; });

      members.forEach(function (m) {
        const id = safeIdPart_(m.code);
        const checkEl = document.getElementById("bonus-check-" + id);
        const valEl = document.getElementById("bonus-val-" + id);

        if (!checkEl || !valEl) {
          // A member this device hasn't rendered yet (someone else scanned
          // them in after our last render) — append a brand-new row for
          // them only; every existing row is left completely untouched.
          list.insertAdjacentHTML("beforeend",
            '<div class="summary-row" data-code="' + escapeHtml(m.code) + '">' +
              '<div class="who"><div class="n">' + escapeHtml(m.name) + '</div><div class="c">' + escapeHtml(m.committee) + ' — ' + escapeHtml(m.code) + '</div></div>' +
              '<div class="bonus">' +
                '<input type="checkbox" id="bonus-check-' + id + '" onchange="document.getElementById(\'bonus-val-' + id + '\').disabled = !this.checked;">' +
                '<input type="number" id="bonus-val-' + id + '" placeholder="pts" min="0" step="1" disabled>' +
              '</div>' +
            '</div>'
          );
          const newCheckEl = document.getElementById("bonus-check-" + id);
          const newValEl = document.getElementById("bonus-val-" + id);
          if (m.bonus > 0 && newCheckEl && newValEl) {
            newCheckEl.checked = true;
            newValEl.disabled = false;
            newValEl.value = m.bonus;
          }
          knownByCode[m.code] = m;
          return;
        }

        // An already-rendered row — never touch it if the operator's focus
        // is on this SPECIFIC row's checkbox or value field right now.
        if (document.activeElement === checkEl || document.activeElement === valEl) return;

        // Local edit already in progress (checkbox ticked, whether saved
        // yet or not) — trust what's on screen, don't overwrite it from the
        // server. Only surface the server's own value when this device
        // hasn't touched this member's row at all.
        if (!checkEl.checked && m.bonus > 0) {
          checkEl.checked = true;
          valEl.disabled = false;
          valEl.value = m.bonus;
        }
        knownByCode[m.code] = m;
      });

      state.sessionMembers = Object.keys(knownByCode).map(function (code) { return knownByCode[code]; });
    }

    // v2.8: pulls the session's list fresh from the sheet again — for when
    // another HR operator is scanning into this SAME still-open session on
    // their own device (see startSession: a session is shared by committee,
    // not per-HR, until someone explicitly closes it with closeSession) and
    // this screen wants to catch whoever they've added since it first
    // loaded, PLUS any bonus points they've already pressed "Save" on, PLUS
    // whether someone just pressed "✖ Close" entirely. This is the actual
    // mechanism behind "real-time" on this stack: Google Apps Script cannot
    // hold a socket open or push to a client on its own (it's a plain
    // request/response Web App), so instead every open screen quietly asks
    // again on a short timer. Anything already ticked here for bonus stays
    // ticked. This used to be a manual "🔄 Refresh List" button; it now runs
    // on its own (see startSummaryAutoRefresh below) instead of waiting for
    // a tap, and stays quiet on screen (no status banner) so it doesn't
    // interrupt someone mid-typing a bonus value — a failed tick just
    // retries on the next one instead of surfacing an error every few
    // seconds.
    function startSummaryAutoRefresh() {
      stopSummaryAutoRefresh(); // never stack two timers
      summaryPollTimer = setInterval(function () {
        if (document.hidden) return; // tab not in front — skip this tick, keep the interval alive for when it is
        silentRefreshSummaryList();
      }, 4000); // v2.8: sped up from 8s — this screen is where cross-device sync matters most
    }

    function stopSummaryAutoRefresh() {
      if (summaryPollTimer) {
        clearInterval(summaryPollTimer);
        summaryPollTimer = null;
      }
    }

    // v2.8.1 FIX: used to call renderSummary(preserved) here, which rebuilt
    // the WHOLE list from scratch on every tick — see the note above
    // syncSummaryList() for why that was actually erasing points on a real
    // phone. Now calls the non-destructive merge instead, which is exactly
    // as safe to run silently every few seconds since it can never disturb
    // whatever row the operator currently has focused.
    function silentRefreshSummaryList() {
      if (!state.sessionId) return;
      jsonp({
        action: "getSessionAttendance",
        committee: state.committee,
        password: state.password,
        hrCode: state.hrCode,
        session: state.sessionId,
      })
        .then(function (res) {
          if (!res.ok) return; // stay quiet on a transient failure — the next tick tries again
          if (res.closed) {
            handleSessionClosedRemotely();
            return;
          }
          syncSummaryList(res.members);
        })
        .catch(function () {
          // stay quiet here too — a real outage will already be obvious from
          // the scanning screen itself, so this doesn't need its own alarm
        });
    }

    // v2.8: the lightweight counterpart to the summary screen's poll, used
    // ONLY while the scanning screen (page 3) is showing — it doesn't need
    // the full member list, just "has someone else closed this?", so it
    // skips straight to that check and doesn't re-render anything scan-page
    // specific.
    function startScanWatch() {
      stopScanWatch();
      scanWatchTimer = setInterval(function () {
        if (document.hidden || !state.sessionId) return;
        jsonp({
          action: "getSessionAttendance",
          committee: state.committee,
          password: state.password,
          hrCode: state.hrCode,
          session: state.sessionId,
        })
          .then(function (res) {
            if (res.ok && res.closed) handleSessionClosedRemotely();
          })
          .catch(function () {});
      }, 8000);
    }

    function stopScanWatch() {
      if (scanWatchTimer) {
        clearInterval(scanWatchTimer);
        scanWatchTimer = null;
      }
    }

    // v2.8: fires on EITHER poll (summary screen or scanning screen) the
    // moment this device learns some other HR operator pressed "✖ Close" on
    // the session it's currently in. Per Mahmoud's requirement, this needs
    // to look and feel the same as if this device had pressed Close itself:
    // everything stops, and it lands back on page 1, clearly explained.
    function handleSessionClosedRemotely() {
      stopSummaryAutoRefresh();
      stopScanWatch();
      if (scanner) {
        try { scanner.stop(); } catch (e) {}
        scanner = null;
      }
      resetToStart(t("readyClosedByOther"));
    }

    // ---- v2.8: Save ONLY writes whatever bonus points are ticked right now
    // to the sheet. It never disables itself, never stops the auto-refresh,
    // and never navigates away — the operator can tick more points and
    // press Save again, or go Back to scan more people and come back to add
    // more, as many times as needed while the session stays open. Ending the
    // session is exclusively closeSummary()'s job below.
    function saveBonuses() {
      if (!state.sessionMembers) return;

      const bonuses = [];
      state.sessionMembers.forEach(function (m) {
        const id = safeIdPart_(m.code);
        const checkEl = document.getElementById("bonus-check-" + id);
        if (checkEl && checkEl.checked) {
          const valEl = document.getElementById("bonus-val-" + id);
          const val = parseFloat(valEl ? valEl.value : "");
          if (!isNaN(val) && val > 0) {
            bonuses.push({ code: m.code, name: m.name, points: val });
          }
        }
      });

      showSummaryStatus(true, t("savingBonuses"));

      jsonp({
        action: "saveSessionBonuses",
        committee: state.committee,
        password: state.password,
        hrCode: state.hrCode,
        session: state.sessionId,
        bonuses: JSON.stringify(bonuses),
      })
        .then(function (res) {
          if (!res.ok) {
            // e.g. someone else closed this session in the meantime
            showSummaryStatus(false, res.message);
            return;
          }
          showSummaryStatus(true, t("savedPoints"));
          // v2.8: pull the sheet's own copy right back so this device's own
          // saved values line up with what everyone else's poll will show —
          // purely cosmetic (the values were already correct on screen),
          // but keeps this screen and the sheet visibly in lockstep.
          silentRefreshSummaryList();
        })
        .catch(function (err) {
          showSummaryStatus(false, t("couldNotSaveBonuses") + err.message + ")" + t("stillSavedAnyway"));
        });
    }

    // ---- v2.8: Close ALWAYS asks for confirmation first, whether or not
    // Save was ever pressed, using Mahmoud's exact required wording. Only on
    // confirming does it call the server to actually end the session — for
    // real, for every HR device that has it open, not just this tab.
    function closeSummary() {
      if (!confirm(t("confirmCloseTitle") + "\n\n" + t("confirmCloseBody"))) return;

      showSummaryStatus(true, t("closingSession"));

      jsonp({
        action: "closeSession",
        committee: state.committee,
        password: state.password,
        hrCode: state.hrCode,
        session: state.sessionId,
      })
        .then(function (res) {
          if (!res.ok) {
            if (/busy/i.test(res.message || "")) {
              // transient lock contention — stay put, let them press Close again
              showSummaryStatus(false, t("sessionBusyRetry"));
              return;
            }
            // already closed by someone else a moment ago — it's just as
            // ended either way, so finish the trip back to page 1 too
            resetToStart(t("readyClosedByOther"));
            return;
          }
          resetToStart(t("readyClosedByMe"));
        })
        .catch(function (err) {
          showSummaryStatus(false, t("connectionError") + err.message);
        });
    }

    // v2.8: the one consistent landing spot after a session is truly ended
    // (by this device or discovered to have been ended by another one) —
    // clears this browser tab's in-memory state and returns to page 1.
    // `message` is shown on page 1 explaining exactly why we're here.
    function resetToStart(message) {
      stopSummaryAutoRefresh();
      stopScanWatch();
      state.hrName = null;
      state.hrCode = null;
      state.committee = null;
      state.committeeName = null;
      state.password = null;
      state.sessionId = null;
      state.scannedCount = 0;
      state.sessionMembers = null;
      const hrNameEl = document.getElementById("hr-name");
      const hrCodeEl = document.getElementById("hr-code");
      const passwordEl = document.getElementById("password");
      const manualEl = document.getElementById("manual-code");
      if (hrNameEl) hrNameEl.value = "";
      if (hrCodeEl) hrCodeEl.value = "";
      if (passwordEl) passwordEl.value = "";
      if (manualEl) manualEl.value = "";
      document.getElementById("summary-status").style.display = "none";
      goToPage(1);
      showResult(true, message || t("readyForNewSession"));
    }

    function showSummaryStatus(ok, message) {
      const el = document.getElementById("summary-status");
      el.style.display = "block";
      el.className = ok ? "ok" : "err";
      el.textContent = message;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // v2.6: one unified confirmation box. When a scan succeeds, the message
    // and the scanned member's name/committee now render together inside
    // #result instead of a separate "scanned-card" box stacked underneath —
    // per management feedback that showing both looked like two boxes.
    function showResult(ok, message, memberName, memberMeta) {
      const el = document.getElementById("result");
      el.style.display = "block";
      el.className = ok ? "ok" : "err";
      if (memberName) {
        el.innerHTML =
          escapeHtml(message) +
          '<div class="scan-name">' + escapeHtml(memberName) + "</div>" +
          '<div class="scan-meta">' + escapeHtml(memberMeta) + "</div>";
      } else {
        el.textContent = message;
      }
    }

    function hideResult() {
      document.getElementById("result").style.display = "none";
    }

    applyLang();
  </script>
</body>
</html>
