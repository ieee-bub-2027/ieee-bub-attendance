<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE BUB — Attendance Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* English UI for now. Every user-facing string lives inline below rather
       than in a separate template system for simplicity — a future Arabic
       toggle can swap these strings without restructuring the page. */
    body { font-family: Arial, sans-serif; direction: ltr; max-width: 480px; margin: 0 auto; padding: 0 12px 24px; color: #0A2036; }
    .header { text-align: center; padding-top: 18px; }
    .header img { width: 110px; height: auto; }
    .season-badge { display: inline-block; margin-top: 8px; background: #0A2036; color: #fff; font-size: 12px; font-weight: bold; letter-spacing: 1px; padding: 3px 12px; border-radius: 999px; }
    h2 { text-align: center; margin: 10px 0 2px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 18px; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; margin-top: 16px; font-size: 16px; background: #0A2036; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button.secondary { background: #fff; color: #0A2036; border: 1px solid #0A2036; margin-top: 8px; }
    #reader { width: 100%; margin-top: 16px; }
    #result { margin-top: 14px; padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; display: none; }
    .ok { background: #DFF5E1; color: #1B6E2E; }
    .err { background: #FBE1E1; color: #A32020; }
    .badge-row { margin-top: 12px; font-size: 13px; color: #0A2036; background: #EAF1FB; border-radius: 6px; padding: 10px 12px; }
    .badge-row div { margin: 2px 0; }
    .step-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .step-dots span { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .step-dots span.active { background: #0A2036; }
    .page { display: none; }
    .page.active { display: block; }
    .scanned-card { margin-top: 12px; padding: 14px; border-radius: 8px; background: #fff; border: 2px solid #1B6E2E; text-align: center; }
    .scanned-card .name { font-size: 18px; font-weight: bold; color: #0A2036; }
    .scanned-card .meta { font-size: 13px; color: #555; margin-top: 4px; }
    .footer { text-align: center; margin-top: 28px; padding-top: 14px; border-top: 1px solid #E0E0E0; font-size: 11px; color: #888; }
    .footer a { color: #0A2036; font-weight: bold; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>

  <h2>IEEE BUB Attendance</h2>
  <div class="subtitle" id="subtitle-text">Step 1 of 3 — HR Operator Login</div>
  <div class="step-dots">
    <span id="dot-1" class="active"></span><span id="dot-2"></span><span id="dot-3"></span>
  </div>

  <!-- ===================== PAGE 1 — HR Operator Login ===================== -->
  <div id="page-hr" class="page active">
    <label>Your Name (HR member)</label>
    <input id="hr-name" type="text" placeholder="e.g. Ahmed Ali">

    <label>Your HR Code</label>
    <input id="hr-code" type="text" placeholder="e.g. HR-001">

    <button onclick="hrLoginNext()">Next</button>
  </div>

  <!-- ===================== PAGE 2 — Committee + Password ===================== -->
  <div id="page-login" class="page">
    <label>Committee</label>
    <select id="committee"></select>

    <label>Committee Password</label>
    <input id="password" type="text" placeholder="6-digit password">

    <button onclick="committeeNext()">Next</button>
    <button class="secondary" onclick="goToPage(1)">Back</button>
  </div>

  <!-- ===================== PAGE 3 — Scan ===================== -->
  <div id="page-scan" class="page">
    <div class="badge-row" id="badge-summary-3"></div>
    <button onclick="startScan()" id="start-scan-btn">Start Scanning</button>
    <button class="secondary" onclick="goToPage(2)">Back</button>
    <div id="reader"></div>
    <div id="scanned-card" class="scanned-card" style="display:none;">
      <div class="name" id="scanned-name"></div>
      <div class="meta" id="scanned-meta"></div>
    </div>
    <div id="result"></div>
  </div>

  <div class="footer">
    © IEEE BUB SB — <a href="https://www.linkedin.com/in/mahmoud-mohamed218" target="_blank" rel="noopener">Mahmoud Shamekh</a>
  </div>

  <script>
    // ====================================================================
    // غيّر السطر ده بس: حط هنا رابط "تطبيق الويب" (Web app) اللي طلع لك من
    // Apps Script بعد Deploy > New deployment > Web app.
    // شكله تقريبًا: https://script.google.com/macros/s/AKfycb.../exec
    // ====================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyKiSjYQfa8zF5OfuSgYXknXtCbizrzQCdfe3R2E1K5-BxNtY9VRes6gJKce06PPicM/exec";

    const SUBTITLES = {
      1: "Step 1 of 3 — HR Operator Login",
      2: "Step 2 of 3 — Committee &amp; Password",
      3: "Step 3 of 3 — Scan",
    };

    // نداء JSONP — بيتفادى مشكلة CORS تمامًا، وده الأسلوب اللي جوجل نفسها بتنصح
    // بيه للنداء على Apps Script من موقع تاني (مفيش fetch ولا headers خاصة).
    function jsonp(params) {
      return new Promise(function (resolve, reject) {
        const cbName = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
        const script = document.createElement("script");

        window[cbName] = function (data) {
          resolve(data);
          cleanup();
        };

        function cleanup() {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        const qs = Object.keys(params)
          .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); })
          .concat(["callback=" + cbName])
          .join("&");

        script.src = API_URL + "?" + qs;
        script.onerror = function () {
          reject(new Error("Could not reach the Google server (check API_URL and your internet connection)"));
          cleanup();
        };
        document.body.appendChild(script);
      });
    }

    if (API_URL.indexOf("PASTE_YOUR") === 0) {
      showResult(false, "API link is not set yet — open index.html and put your Apps Script link in the API_URL variable.");
    } else {
      jsonp({ action: "getCommittees" })
        .then(populateCommittees)
        .catch(function (err) {
          showResult(false, "Could not load the committee list: " + err.message);
        });
    }

    function populateCommittees(list) {
      const sel = document.getElementById("committee");
      list.forEach(function (c) {
        const opt = document.createElement("option");
        opt.value = c.code;
        opt.textContent = c.code + " — " + c.name;
        sel.appendChild(opt);
      });
    }

    // ---- Shared state carried across the 3 pages ----
    let state = {
      hrName: null,
      hrCode: null,
      committee: null,
      committeeName: null,
      password: null,
      sessionId: null,
    };
    let scanner = null;

    function goToPage(n) {
      [1, 2, 3].forEach(function (i) {
        document.getElementById("page-" + (i === 1 ? "hr" : i === 2 ? "login" : "scan")).classList.toggle("active", i === n);
        document.getElementById("dot-" + i).classList.toggle("active", i <= n);
      });
      document.getElementById("subtitle-text").innerHTML = SUBTITLES[n];
      hideResult();
    }

    // ---- Page 1 -> 2 : confirm the HR operator's own identity ----
    function hrLoginNext() {
      const hrName = document.getElementById("hr-name").value.trim();
      const hrCode = document.getElementById("hr-code").value.trim();
      if (!hrName || !hrCode) {
        showResult(false, "Please enter your name and your HR code first.");
        return;
      }
      showResult(true, "Confirming your HR code...");

      jsonp({ action: "validateHrOperator", hrCode: hrCode })
        .then(function (res) {
          if (!res.ok) {
            showResult(false, res.message);
            return;
          }
          state.hrName = res.hrName; // the real name on file — used for the log, not the typed one
          state.hrCode = res.hrCode;

          hideResult();
          goToPage(2);
        })
        .catch(function (err) {
          showResult(false, "Could not reach the Google server: " + err.message);
        });
    }

    // ---- Page 2 -> 3 : validate committee + password, auto-generate Session ID ----
    function committeeNext() {
      const committee = document.getElementById("committee").value;
      const password = document.getElementById("password").value;
      if (!committee || !password) {
        showResult(false, "Please choose the committee and type its password first.");
        return;
      }
      showResult(true, "Checking password and preparing the session...");

      jsonp({ action: "startSession", committee: committee, password: password, hrCode: state.hrCode })
        .then(function (res) {
          if (!res.ok) {
            showResult(false, res.message);
            return;
          }
          state.committee = committee;
          state.committeeName = document.getElementById("committee").selectedOptions[0].textContent;
          state.password = password;
          state.sessionId = res.sessionId;

          document.getElementById("badge-summary-3").innerHTML =
            "<div><b>Committee:</b> " + state.committeeName + "</div>" +
            "<div><b>Session:</b> " + state.sessionId + " (auto-generated)</div>" +
            "<div><b>Scanning as (HR):</b> " + state.hrName + " (" + state.hrCode + ")</div>";

          hideResult();
          goToPage(3);
        })
        .catch(function (err) {
          showResult(false, "Could not reach the Google server: " + err.message);
        });
    }

    // ---- Page 3 : camera scanning ----
    function startScan() {
      if (scanner) return;

      if (typeof Html5Qrcode === "undefined") {
        showResult(false, "The QR-reading library did not load from the internet. Make sure you have a working connection, refresh the page, and try again.");
        return;
      }

      document.getElementById("start-scan-btn").style.display = "none";
      showResult(true, "Opening the camera... if a permission prompt appears, tap Allow.");

      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        function (decodedText) {
          scanner.pause(true);
          jsonp({
            action: "recordAttendance",
            committee: state.committee,
            password: state.password,
            memberId: decodedText,
            session: state.sessionId,
            hrCode: state.hrCode,
          })
            .then(function (res) {
              onScanResult(res);
              setTimeout(function () { try { scanner.resume(); } catch (e) {} }, 1500);
            })
            .catch(function (err) {
              showResult(false, "Connection error: " + err.message);
              setTimeout(function () { try { scanner.resume(); } catch (e) {} }, 1500);
            });
        }
      ).catch(function (err) {
        scanner = null;
        document.getElementById("start-scan-btn").style.display = "block";
        var msg = String(err && err.message ? err.message : err);
        var extra = "";
        if (/NotAllowedError|Permission/i.test(msg)) {
          extra = " — tap the lock 🔒 or (ⓘ) icon next to the address bar above ← Permissions ← Camera ← Allow, then refresh and try again.";
        } else if (/NotFoundError|no camera/i.test(msg)) {
          extra = " — no back camera was found on this device, try another browser or device.";
        } else if (/NotReadableError/i.test(msg)) {
          extra = " — the camera might be in use by another app right now, close any open camera app and try again.";
        }
        showResult(false, "Could not open the camera: " + msg + extra);
      });
    }

    function onScanResult(res) {
      showResult(res.ok, res.message);
      const card = document.getElementById("scanned-card");
      if (res.ok && res.memberName) {
        document.getElementById("scanned-name").textContent = res.memberName;
        document.getElementById("scanned-meta").textContent = res.memberCommittee + " — " + res.memberCode;
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    }

    function showResult(ok, message) {
      const el = document.getElementById("result");
      el.style.display = "block";
      el.className = ok ? "ok" : "err";
      el.textContent = message;
    }

    function hideResult() {
      document.getElementById("result").style.display = "none";
      document.getElementById("scanned-card").style.display = "none";
    }
  </script>
</body>
</html>
